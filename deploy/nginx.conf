# ============================================
# Cykel — nginx site config for cykel.health
# Serves the static landing at / and the PWA at /app/ from one origin.
# Place at /etc/nginx/sites-available/cykel.health and symlink into sites-enabled.
# Obtain certs first:  sudo certbot --nginx -d cykel.health -d www.cykel.health
# ============================================

# ---- HTTP -> HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name cykel.health www.cykel.health;
    return 301 https://cykel.health$request_uri;
}

# ---- www -> apex (canonical) ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.cykel.health;

    ssl_certificate     /etc/letsencrypt/live/cykel.health/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cykel.health/privkey.pem;

    return 301 https://cykel.health$request_uri;
}

# ---- Main site ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cykel.health;

    root /var/www/cykel;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/cykel.health/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cykel.health/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ---- Security headers (apply site-wide; inherited by locations
    #      that don't declare their own add_header) ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # publickey-credentials-get stays enabled (self) for the app's WebAuthn unlock.
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), usb=(), payment=(), accelerometer=(), gyroscope=(), magnetometer=(), interest-cohort=(), publickey-credentials-get=(self)" always;
    # frame-ancestors here works (it can't in a <meta> tag) — real clickjacking defense.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # IMPORTANT: nginx drops ALL inherited add_header directives in any location
    # that declares its own add_header. So cache control below uses `expires`
    # (which does NOT reset inheritance) — every location keeps the security
    # headers above. Do not add `add_header` inside these locations.

    # HTML + service worker must revalidate so updates ship promptly.
    location = / { expires -1; try_files /index.html =404; }
    location ~* \.html$ { expires -1; }
    location = /app/sw.js { expires -1; }

    # The PWA — same-origin under /app/. SPA-style fallback to its shell.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # Long-cache static assets (icons). JS/CSS stay default since filenames
    # aren't content-hashed; the service worker handles app-level caching.
    location ~* \.(png|svg|ico|webp|woff2?)$ {
        expires 30d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # No directory listings; deny dotfiles.
    autoindex off;
    location ~ /\. { deny all; }
}
